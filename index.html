<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>持股計算</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="持股計算">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2563eb">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c1f24;--mut:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--up:#d92d20;--dn:#039855;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161a;--card:#1e2126;--tx:#eceff3;--mut:#9aa3af;--bd:#2f343b;--ac:#6ea0ff;--up:#ff6b5e;--dn:#34d399}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161a;--card:#1e2126;--tx:#eceff3;--mut:#9aa3af;--bd:#2f343b;--ac:#6ea0ff;--up:#ff6b5e;--dn:#34d399}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:16px}
main{max-width:760px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}.grid input{min-width:0}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
input:disabled{opacity:.6}
.top{display:flex;gap:8px;margin-bottom:8px}
.pie{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}.pie svg{width:200px;height:200px;flex:none}.leg{flex:1;min-width:190px;font-size:13px}.leg div{display:flex;align-items:center;gap:6px;padding:3px 0}.leg i{width:10px;height:10px;border-radius:50%;flex:none}.leg span{margin-left:auto;text-align:right}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;border-top:1px solid var(--bd);margin-top:10px;padding-top:10px}.sum b{display:block;font-size:16px}.sum span{font-size:12px;color:var(--mut)}.top{flex-wrap:wrap}.top>*:first-child{flex:1 1 100%;min-width:0}.top select{flex:1;min-width:0}
button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.adds{display:flex;gap:8px;flex-wrap:wrap}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center}
.big b{display:block;font-size:20px}.big>div{padding:4px 0}.calc{font-size:13px;color:var(--mut);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px}.calc b{color:var(--tx);font-weight:600}
.big span{font-size:12px;color:var(--mut)}
.up{color:var(--up)}.dn{color:var(--dn)}.warn{color:#b54708;font-size:13px;margin-top:8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;min-width:420px}
th,td{padding:6px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}
small{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>台股持股曝險計算器</h1>
<p class="sub">輸入股數、成本、現價，自動統計總資產、各類比重與曝險。</p>

<div class="card">
  <div class="big">
    <div><b id="sTotal">-</b><span>總資產（含現金）</span></div>
    <div><b id="sExp">-</b><span>整體曝險倍率</span></div>
    <div><b id="sPL">-</b><span>未實現損益</span></div>
    <div><b id="sExpAmt">-</b><span>總曝險金額</span></div>
    <div><b id="sCost">-</b><span>總持有成本</span></div>
    <div><b id="sMV">-</b><span>持股市值</span></div>
  </div>
  <div class="tw"><table>
    <thead><tr><th>類別</th><th>市值</th><th>比重</th><th>曝險倍率</th><th>損益</th></tr></thead>
    <tbody id="cats"></tbody>
  </table></div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>資產配置</b><select id="pmode" style="width:auto"><option value="h">依持股</option><option value="c">依類別</option></select></div>
  <div id="pie"></div>
</div>

<div class="card">
  <div class="grid" style="margin-bottom:10px">
    <div><label>現金（元）</label><input type="number" step="any" inputmode="decimal" id="cash"></div>
    <div><label>成本輸入方式</label><select id="cmode"><option value="unit">每股成本</option><option value="total">總成本</option></select></div>
    <div><label>數量單位</label><select id="umode"><option value="lot">張（1張=1000股）</option><option value="share">股</option></select></div>
  </div>
  <div class="adds" style="margin-bottom:10px">
    <button class="p" data-add="etf">＋ 原型ETF</button>
    <button class="p" data-add="stock">＋ 個股</button>
    <button class="p" data-add="l2">＋ 正二</button>
    <button id="reset">重置</button>
  </div>
  <div id="rows"></div>
  <datalist id="tk"></datalist>
  <small>曝險金額 = 市值 × 曝險倍率（正二預設 2 倍，反一可填 -1）。整體曝險倍率 = 總曝險金額 ÷ 總資產。</small>
</div>

<div class="card">
  <small><b>關於收盤價：</b>此頁面無法連線證交所 API（瀏覽器跨網域限制），請手動更新現價。若要自動抓取，可再請我寫成本機執行的版本。</small>
</div>
<div class="card">
  <b>資料備份</b>
  <textarea id="bk" rows="3" style="width:100%;margin:8px 0;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:13px" placeholder="按「匯出」會產生備份文字；要還原時貼在這裡再按「匯入」"></textarea>
  <div class="adds"><button id="bex">匯出（並複製）</button><button id="bim">匯入</button></div>
  <small>資料只存在這支手機的 App 內。換手機或清除資料前，請先匯出並存到備忘錄。</small>
</div>
</main>

<script>
var NAMES={etf:'原型ETF',stock:'個股',l2:'正二'};
var LEV={etf:1,stock:1,l2:2};
var KEY='tw-portfolio-v3';
var TK={'0050':['元大台灣50','etf'],'006208':['富邦台50','etf'],'0056':['元大高股息','etf'],'00878':['國泰永續高股息','etf'],'00919':['群益台灣精選高息','etf'],'00631L':['元大台灣50正2','l2'],'00663L':['國泰臺灣加權正2','l2'],'00675L':['富邦臺灣加權正2','l2'],'00685L':['群益臺灣加權正2','l2'],'2330':['台積電','stock'],'2317':['鴻海','stock'],'2454':['聯發科','stock'],'2308':['台達電','stock'],'2412':['中華電','stock'],'2881':['富邦金','stock'],'2882':['國泰金','stock']};
(function(){var h='';Object.keys(TK).forEach(function(k){h+='<option value="'+k+'">'+TK[k][0]+'</option>';});document.getElementById('tk').innerHTML=h;})();
function findTk(v){v=String(v||'').trim().toUpperCase();for(var k in TK){if(k===v||TK[k][0].toUpperCase()===v)return k;}return null;}
var st=null;
function defaults(){return {cash:0,mode:'unit',unit:'lot',rows:[
 {cat:'etf',code:'0050',n:1,cost:150,px:160,lev:1},
 {cat:'stock',code:'2330',n:0.2,cost:900,px:1000,lev:1},
 {cat:'l2',code:'00631L',n:2,cost:20,px:24,lev:2}]};}
try{
  var s=localStorage.getItem(KEY);
  if(s){st=JSON.parse(s);}
  else{
    var old=localStorage.getItem('tw-portfolio-v2');
    st=old?JSON.parse(old):defaults();
    if(old&&Array.isArray(st.rows)&&st.unit!=='lot'){
      st.rows.forEach(function(r){if(r.n!==''&&r.n!==undefined)r.n=+((parseFloat(r.n)||0)/1000).toFixed(6);});
    }
    st.unit='lot';
  }
}catch(e){st=defaults();}
if(!st||!Array.isArray(st.rows))st=defaults();
if(!st.unit){st.unit='lot';}
function U(){return st.unit==='lot'?1000:1;}

function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function fmt(n,d){return n.toLocaleString('zh-TW',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function sg(n,d){return (n>0?'+':'')+fmt(n,d);}
function cls(n){return n>0?'up':n<0?'dn':'';}
var COLORS=['#2563eb','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#64748b'];
function drawPie(){
  var mode=document.getElementById('pmode').value,m={},cash=num(st.cash),cost=0,mvs=0;
  st.rows.forEach(function(r){
    var x=metrics(r);cost+=x.cost;mvs+=x.mv;
    if(x.mv<=0)return;
    var k=mode==='c'?NAMES[r.cat]:(r.code||NAMES[r.cat]);m[k]=(m[k]||0)+x.mv;
  });
  if(cash>0)m['現金']=cash;
  var ks=Object.keys(m),tot=0;ks.forEach(function(k){tot+=m[k];});
  var pl=mvs-cost,pct=cost>0?pl/cost*100:0;
  var h='<div class="pie">';
  if(tot<=0){h+='<small>請先輸入持股資料。</small></div>';document.getElementById('pie').innerHTML=h;return;}
  var svg='<svg viewBox="0 0 200 200">',a=-Math.PI/2,leg='';
  ks.forEach(function(k,j){
    var f=m[k]/tot,c=COLORS[j%COLORS.length];
    if(f>=0.9999){svg+='<circle cx="100" cy="100" r="92" fill="'+c+'"/><text x="100" y="36" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" stroke="rgba(0,0,0,.4)" stroke-width="2.5" style="paint-order:stroke">100%</text>';}
    else{
      var b=a+f*2*Math.PI,x0=100+92*Math.cos(a),y0=100+92*Math.sin(a),x1=100+92*Math.cos(b),y1=100+92*Math.sin(b);
      svg+='<path d="M100 100L'+x0.toFixed(2)+' '+y0.toFixed(2)+'A92 92 0 '+(f>0.5?1:0)+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'Z" fill="'+c+'"/>';
      if(f>=0.04){var md=(a+b)/2;svg+='<text x="'+(100+73*Math.cos(md)).toFixed(1)+'" y="'+(100+73*Math.sin(md)+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" stroke="rgba(0,0,0,.4)" stroke-width="2.5" style="paint-order:stroke">'+(f*100).toFixed(1)+'%</text>';}
      a=b;
    }
    leg+='<div><i style="background:'+c+'"></i>'+k+'<span>'+fmt(m[k])+'　'+(f*100).toFixed(1)+'%</span></div>';
  });
  svg+='<circle cx="100" cy="100" r="54" fill="var(--card)"/><text x="100" y="96" text-anchor="middle" font-size="11" fill="var(--mut)">總資產</text><text x="100" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="var(--tx)">'+fmt(tot)+'</text></svg>';
  h+=svg+'<div class="leg">'+leg+'</div></div>';
  h+='<div class="sum"><div><b>'+fmt(cost)+'</b><span>總持有成本</span></div><div><b>'+fmt(mvs)+'</b><span>目前市值</span></div><div><b class="'+cls(pl)+'">'+sg(pl)+'</b><span>現在損益（'+sg(pct,2)+'%）</span></div></div>';
  document.getElementById('pie').innerHTML=h;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function metrics(r){
  var n=num(r.n)*U(),mv=n*num(r.px);
  var cost=st.mode==='total'?num(r.cost):n*num(r.cost);
  var pl=mv-cost;
  return {mv:mv,cost:cost,pl:pl,pct:cost>0?pl/cost*100:0,ex:mv*num(r.lev)};
}
function fld(i,k,l,v){return '<div><label>'+l+'</label><input type="number" step="any" inputmode="decimal" data-i="'+i+'" data-k="'+k+'" value="'+(v===undefined?'':v)+'"></div>';}

function render(){
  document.getElementById('cash').value=st.cash||'';
  document.getElementById('cmode').value=st.mode;
  document.getElementById('umode').value=st.unit;
  var h='';
  st.rows.forEach(function(r,i){
    h+='<div class="row"><div class="top">'
     +'<input type="text" list="tk" autocomplete="off" data-i="'+i+'" data-k="code" value="'+String(r.code||'').replace(/"/g,'&quot;')+'" placeholder="輸入代號或名稱，例如 0050、台積電">'
     +'<select data-i="'+i+'" data-k="cat">'
     +Object.keys(NAMES).map(function(k){return '<option value="'+k+'"'+(k===r.cat?' selected':'')+'>'+NAMES[k]+'</option>';}).join('')
     +'</select><button data-del="'+i+'">刪除</button></div><div class="grid">'
     +fld(i,'n',st.unit==='lot'?'張數':'股數',r.n)+fld(i,'cost',st.mode==='total'?'總成本':'每股成本',r.cost)+fld(i,'px','現價',r.px)
     +'</div><div class="grid" style="margin-top:8px">'+fld(i,'lev','曝險倍率',r.lev)+'</div>'
     +'<div class="calc" id="c'+i+'"></div></div>';
  });
  document.getElementById('rows').innerHTML=h||'<small>尚無持股，請按上方新增。</small>';
  calc();
}

function calc(){
  var agg={},tmv=0,tex=0,tpl=0,tcost=0,cash=num(st.cash);
  Object.keys(NAMES).forEach(function(k){agg[k]={mv:0,ex:0,pl:0};});
  var ms=st.rows.map(function(r){
    var m=metrics(r),a=agg[r.cat];
    tmv+=m.mv;tex+=m.ex;tpl+=m.pl;tcost+=m.cost;
    a.mv+=m.mv;a.ex+=m.ex;a.pl+=m.pl;return m;
  });
  var total=tmv+cash;
  st.rows.forEach(function(r,i){
    var m=ms[i],el=document.getElementById('c'+i);
    if(!el)return;
    el.innerHTML='<span>股數 <b>'+fmt(num(st.rows[i].n)*U())+'</b></span><span>市值 <b>'+fmt(m.mv)+'</b></span><span>占總資產 <b>'+(total>0?fmt(m.mv/total*100,1):'0.0')+'%</b></span>'
      +'<span>損益 <b class="'+cls(m.pl)+'">'+sg(m.pl)+'（'+sg(m.pct,2)+'%）</b></span>';
  });
  function set(id,t,c){var e=document.getElementById(id);e.textContent=t;e.className=c||'';}
  set('sTotal',fmt(total));
  set('sExp',(total>0?(tex/total).toFixed(2):'0.00')+'x');
  set('sPL',sg(tpl)+(tcost>0?'（'+sg(tpl/tcost*100,2)+'%）':''),cls(tpl));
  set('sExpAmt',fmt(tex));
  set('sCost',fmt(tcost));
  set('sMV',fmt(tmv));
  drawPie();
  var t='';
  Object.keys(agg).forEach(function(k){
    var a=agg[k];
    t+='<tr><td>'+NAMES[k]+'</td><td>'+fmt(a.mv)+'</td><td>'+(total>0?fmt(a.mv/total*100,1):'0.0')+'%</td><td>'+(total>0?(a.ex/total).toFixed(2):'0.00')+'x</td><td class="'+cls(a.pl)+'">'+sg(a.pl)+'</td></tr>';
  });
  t+='<tr><td>現金</td><td>'+fmt(cash)+'</td><td>'+(total>0?fmt(cash/total*100,1):'0.0')+'%</td><td>0.00x</td><td>-</td></tr>';
  document.getElementById('cats').innerHTML=t;
  save();
}

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='cash'){st.cash=t.value;calc();return;}
  var i=t.getAttribute('data-i'),k=t.getAttribute('data-k');
  if(i===null||t.tagName==='SELECT')return;
  st.rows[i][k]=t.value;calc();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='umode'){
    var fac=(t.value==='lot'&&st.unit==='share')?0.001:(t.value==='share'&&st.unit==='lot')?1000:1;
    st.rows.forEach(function(r){if(r.n!==''&&r.n!==undefined)r.n=+(num(r.n)*fac).toFixed(6);});
    st.unit=t.value;render();return;
  }
  if(t.id==='pmode'){drawPie();return;}
  if(t.getAttribute('data-k')==='code'){
    var i0=t.getAttribute('data-i'),k0=findTk(t.value);
    if(k0){var r0=st.rows[i0];r0.code=k0+' '+TK[k0][0];r0.cat=TK[k0][1];r0.lev=LEV[r0.cat];render();}
    return;
  }
  if(t.id==='cmode'){
    st.rows.forEach(function(r){var n=num(r.n)*U(),c=num(r.cost);
      if(t.value==='total'&&st.mode==='unit')r.cost=+(c*n).toFixed(2);
      else if(t.value==='unit'&&st.mode==='total')r.cost=n>0?+(c/n).toFixed(4):0;});
    st.mode=t.value;render();return;
  }
  if(t.tagName==='SELECT'){var i=t.getAttribute('data-i');st.rows[i].cat=t.value;st.rows[i].lev=LEV[t.value];render();}
});
document.addEventListener('click',function(e){
  var a=e.target.getAttribute('data-add'),d=e.target.getAttribute('data-del');
  if(a){st.rows.push({cat:a,code:'',n:'',cost:'',px:'',lev:LEV[a]});render();}
  else if(d!==null){st.rows.splice(parseInt(d,10),1);render();}
  else if(e.target.id==='reset'){st=defaults();render();}
});
render();
document.getElementById('bex').onclick=function(){var t=JSON.stringify(st),b=document.getElementById('bk');b.value=t;b.select();try{navigator.clipboard.writeText(t);}catch(e){}};
document.getElementById('bim').onclick=function(){try{var o=JSON.parse(document.getElementById('bk').value);if(!o||!Array.isArray(o.rows))throw 0;st=o;if(!st.unit)st.unit='lot';render();}catch(e){alert('備份格式不正確');}};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</html>
